name: Docs
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  fixture-sources:
    # Code shown in the docs must match the example files it names.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shown code against the example files
        run: python3 docs/check_sources.py
